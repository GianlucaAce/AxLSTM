[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axlstm"
version = "0.1.0"
description = "Modular LSTM toolbox for univariate time series forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "@GianlucaAce", email = "gianlucaace@duck.com" }
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "keras>=3.0.0",
    "tensorflow>=2.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.urls]
Repository = "https://github.com/GianlucaAce/AxLSTM"